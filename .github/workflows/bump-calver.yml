name: Bump calver year and month

on:
  schedule:
     - cron: "35 8 12 * *"
       timezone: "America/New_York"

permissions:
  contents: write

jobs:
  bump-month:
    uses: inclusive-design/workflows/.github/workflows/calver-monthly.yml@calver-bump
    with:
      GHA_APP_ID: ${{ vars.GHA_APP_ID }}
    secrets:
      GHA_PRIVATE_KEY: ${{ secrets.GHA_PRIVATE_KEY }}
