name: Bump calver
on:
  schedule:
     - cron: "35 * * * *"

permissions:
  contents: write

jobs:
  bump-month:
    uses: inclusive-design/workflows/.github/workflows/calver-month.yml@calver-bump
    with:
      GHA_APP_ID: ${{ vars.GHA_APP_ID }}
    secrets:
      GHA_PRIVATE_KEY: ${{ secrets.GHA_PRIVATE_KEY }}
